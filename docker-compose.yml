version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: medora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medora_user
      POSTGRES_PASSWORD: medora_secure_password
      POSTGRES_DB: medora_db
    ports:
      - "5432:5432"
    volumes:
      - medora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medora_user -d medora_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medora-net

  # 2. Production Live Backend (BLUE)
  backend-blue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medora-backend-blue
    restart: unless-stopped
    environment:
      APP_ENV: blue
      APP_VERSION: "1.0.0"
      DATABASE_URL: postgresql://medora_user:medora_secure_password@postgres:5432/medora_db
      SECRET_KEY: medora_devsecops_jwt_secret_key_change_in_production_99882211
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - medora-net

  # 3. Candidate Staging Backend (GREEN) for Blue-Green Verification
  backend-green:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medora-backend-green
    restart: unless-stopped
    environment:
      APP_ENV: green
      APP_VERSION: "1.1.0-preview"
      DATABASE_URL: postgresql://medora_user:medora_secure_password@postgres:5432/medora_db
      SECRET_KEY: medora_devsecops_jwt_secret_key_change_in_production_99882211
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - medora-net

  # 4. Frontend Single-Page Application (Reverse Proxy & Static Serve)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medora-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend-blue
    networks:
      - medora-net

  # 5. Prometheus Metrics Aggregator
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: medora-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - medora-net

  # 6. Grafana Operational Dashboards
  grafana:
    image: grafana/grafana:10.4.1
    container_name: medora-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - medora-net

networks:
  medora-net:
    driver: bridge

volumes:
  medora_pgdata:
    driver: local
