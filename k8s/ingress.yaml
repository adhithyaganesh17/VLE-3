apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medora-ingress
  namespace: medora
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: medora-backend-svc
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: medora-backend-svc
                port:
                  number: 8000
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: medora-backend-svc
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: medora-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medora-frontend-svc
                port:
                  number: 80
