apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medora-postgres-pvc
  namespace: medora
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medora-postgres
  namespace: medora
  labels:
    app: medora
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medora
      component: database
  template:
    metadata:
      labels:
        app: medora
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - configMapRef:
                name: medora-postgres-config
            - secretRef:
                name: medora-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - medora_user
                - -d
                - medora_db
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - medora_user
                - -d
                - medora_db
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: medora-postgres-pvc
