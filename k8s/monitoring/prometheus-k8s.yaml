apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: medora
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'medora-backend'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - medora
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: medora-backend-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medora-prometheus
  namespace: medora
  labels:
    app: medora-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medora-prometheus
  template:
    metadata:
      labels:
        app: medora-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: medora-prometheus-svc
  namespace: medora
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: medora-prometheus
