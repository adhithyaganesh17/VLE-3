
apiVersion: v1
kind: Service
metadata:
  name: medora-frontend-svc
  namespace: medora
  labels:
    app: medora
    component: frontend
    service-type: routing

spec:
  type: NodePort

  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http

  # BLUE-GREEN CUTOVER TARGET
  selector:
    app: medora
    component: frontend
    environment: blue
