apiVersion: v1
kind: Service
metadata:
  name: medora-frontend-svc
  namespace: medora
  labels:
    app: medora
    component: frontend
    service-type: routing
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  # BLUE-GREEN CUTOVER TARGET:
  # To route traffic to GREEN:
  # kubectl patch svc medora-frontend-svc -n medora -p '{"spec":{"selector":{"environment":"green"}}}'
  selector:
    app: medora
    component: frontend
    environment: blue
