# SonarQube Project Configuration for MEDORA
sonar.projectKey=medora-healthcare-platform
sonar.projectName=MEDORA — Smart Healthcare Operations Platform
sonar.projectVersion=1.0.0

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/venv/**,**/node_modules/**,**/dist/**,**/.pytest_cache/**

# Python SAST settings
sonar.python.version=3.12, 3.13
sonar.python.coverage.reportPaths=backend/coverage.xml

# Quality Gate Thresholds
sonar.qualitygate.wait=false
